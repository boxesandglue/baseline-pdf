name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Both architectures: floating point results have differed between
    # arm64 and amd64 before (boxesandglue#50). Both Go versions: the go
    # line of go.mod is the oldest one we promise, stable the one users get.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
        go: [go.mod, stable]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go from go.mod
        if: matrix.go == 'go.mod'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up the latest Go
        if: matrix.go == 'stable'
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Font fixtures
        # The font tests read their fonts from boxes and glue's QA fonts,
        # next to this repository as in the mono repository, and skip
        # without them. Fetch only that directory, and fail if it is
        # missing, so the tests cannot skip unnoticed.
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/boxesandglue/boxesandglue ../boxesandglue
          git -C ../boxesandglue sparse-checkout set qa/fonts/upem/fonts
          ls ../boxesandglue/qa/fonts/upem/fonts/CrimsonPro-Regular.ttf

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        # boxes and glue writes several documents at once, each with its
        # own PDF writer, so run the race detector as well.
        run: go test -race ./...
